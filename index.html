<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="theme-color" content="#121622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DRSTUDY · 研究生工作台 — 科研进度与学术生涯管理</title>
<!-- 云端同步配置（Supabase）。填好 cloud-config.js 中的项目 URL 和 anon key 即自动启用；缺省时为纯本地模式 -->
<script src="cloud-config.js"></script>
<style>
:root{
  --bg:#121622; --panel:#1b2133; --panel2:#212944; --border:#2e3856;
  --text:#d8e2f4; --muted:#8898b8; --accent:#8b9cf5; --accent2:#4ec9d4;
  --indigo:#6f7ef0; --cyan:#4ec9d4; --rose:#e87a9e; --amber:#f0c060; --violet:#b89cf5;
  --danger:#e05f6f; --ok:#5fcf97; --warn:#f0c060;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;line-height:1.6;}
a{color:var(--accent);text-decoration:none;}
/* ===== 布局 ===== */
.app{display:flex;min-height:100vh;}
.sidebar{width:214px;background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:10;}
.main{margin-left:214px;flex:1;padding:24px 28px 60px;max-width:1240px;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6f7ef0,#4ec9d4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#121622;}
.brand .t1{font-size:16px;font-weight:700;color:#eef2ff;}
.brand .t2{font-size:11px;color:var(--muted);}
/* 云端同步状态 */
.cloud-pill{font-size:11px;border-radius:8px;padding:3px 10px;margin:0 6px 12px;text-align:center;border:1px solid var(--border);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cloud-pill.ok{color:var(--ok);border-color:rgba(95,207,151,.45);}
.cloud-pill.err{color:var(--danger);border-color:rgba(224,95,111,.45);}
.cloud-pill.sync{color:var(--accent2);border-color:rgba(78,201,212,.45);}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--muted);margin:3px 0;font-size:14px;transition:all .15s;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:linear-gradient(90deg,#26304e,#212944);color:var(--accent);}
.nav-item .ico{width:20px;text-align:center;}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;border-radius:9px;padding:0 6px;min-width:17px;text-align:center;line-height:17px;}
.nav-sec{font-size:11px;color:#566383;margin:14px 10px 4px;letter-spacing:1px;}
/* ===== 通用 ===== */
.page{display:none;}
.page.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
h2{font-size:20px;color:#eef2ff;margin:0 0 6px;display:flex;align-items:center;gap:10px;}
h2 .sub{font-size:12.5px;color:var(--muted);font-weight:400;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin:14px 0;}
.card h3{font-size:15px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card h3 .act{margin-left:auto;}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;transition:all .15s;font-family:inherit;}
.btn:hover{border-color:var(--accent2);color:var(--accent2);}
.btn.primary{background:linear-gradient(135deg,#6f7ef0,#5a6ce0);color:#fff;border:none;font-weight:600;}
.btn.primary:hover{filter:brightness(1.12);}
.btn.sm{padding:3px 10px;font-size:12px;border-radius:6px;}
.btn.danger:hover{border-color:var(--danger);color:var(--danger);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--panel2);color:var(--accent);padding:9px 10px;text-align:left;border:1px solid var(--border);font-weight:600;white-space:nowrap;}
td{padding:9px 10px;border:1px solid var(--border);vertical-align:top;}
tr:hover td{background:#242c46;}
.tag{display:inline-block;font-size:11px;border-radius:10px;padding:1px 9px;margin:1px 3px 1px 0;white-space:nowrap;}
.t-green{background:#173d2f;color:#5fcf97;} .t-blue{background:#1c2848;color:#8b9cf5;}
.t-gold{background:#3a3018;color:#f0c060;} .t-purple{background:#2c2440;color:#b89cf5;}
.t-red{background:#3a1e24;color:#e87a9e;} .t-gray{background:#28304a;color:#8898b8;}
.t-cyan{background:#143a3d;color:#4ec9d4;}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}
.muted{color:var(--muted);}
.mono{font-family:"SF Mono","Consolas","Roboto Mono",monospace;font-size:12px;}
/* ===== 表单 ===== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.fg{margin-bottom:10px;}
.fg.full{grid-column:1/-1;}
.fg label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;}
.fg input,.fg select,.fg textarea{width:100%;background:#0e1320;border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 10px;font-size:13px;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent2);}
.fg textarea{resize:vertical;min-height:60px;}
/* ===== 模态框 ===== */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(8,11,20,.72);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal-mask.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:780px;padding:22px 26px;margin-bottom:40px;}
.modal h3{color:var(--accent);font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.modal .close{cursor:pointer;color:var(--muted);font-size:18px;}
.modal .close:hover{color:var(--danger);}
.modal .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
/* ===== 工作台 ===== */
.hero{background:linear-gradient(150deg,#222a48,#1a2138);border:1px solid var(--border);border-radius:14px;padding:22px 26px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.hero .hello{font-size:19px;color:#eef2ff;font-weight:600;}
.hero .hello small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:4px;}
.hero .ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--accent2) var(--p,0%),#2a3354 0);display:flex;align-items:center;justify-content:center;}
.hero .ring .inner{width:42px;height:42px;border-radius:50%;background:#1a2138;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent2);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.stat .num{font-size:26px;font-weight:700;}
.stat .lbl{font-size:12px;color:var(--muted);}
.stat.c1 .num{color:var(--accent);} .stat.c2 .num{color:var(--accent2);} .stat.c3 .num{color:var(--ok);} .stat.c4 .num{color:var(--violet);} .stat.c5 .num{color:var(--rose);}
.dd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.dd{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:11px 14px;}
.dd .t{font-size:13.5px;color:#eef2ff;font-weight:600;}
.dd .m{font-size:11.5px;color:var(--muted);margin-top:3px;}
.dd .days{font-size:12px;font-weight:700;margin-top:4px;}
.dd.urgent{border-left-color:var(--danger);} .dd.urgent .days{color:var(--danger);}
.dd.soon{border-left-color:var(--warn);} .dd.soon .days{color:var(--warn);}
.dd.far .days{color:var(--ok);}
/* Agent 提示 */
.agent-box{background:linear-gradient(150deg,#1c2640,#1b2133);border:1px solid #2d3e6e;border-radius:12px;padding:16px 20px;margin:14px 0;}
.agent-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.agent-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6f7ef0,#4ec9d4);display:flex;align-items:center;justify-content:center;font-size:16px;color:#121622;font-weight:700;}
.agent-head b{color:var(--accent2);font-size:14.5px;}
.agent-head small{color:var(--muted);font-size:11.5px;}
.sug{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #2a3a58;align-items:flex-start;}
.sug:last-child{border-bottom:none;}
.sug .lvl{font-size:11px;border-radius:5px;padding:1px 7px;white-space:nowrap;margin-top:2px;}
.sug.high .lvl{background:#3a1e24;color:#e87a9e;}
.sug.mid .lvl{background:#3a3018;color:#f0c060;}
.sug.low .lvl{background:#173d2f;color:#5fcf97;}
.sug .txt{font-size:13px;color:var(--text);}
/* 进度条 */
.bar{height:8px;background:#0e1320;border-radius:5px;overflow:hidden;border:1px solid var(--border);}
.bar .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#6f7ef0,#4ec9d4);transition:width .4s;}
.bar .fill.warn{background:linear-gradient(90deg,#f0c060,#e8a040);}
.bar .fill.danger{background:linear-gradient(90deg,#e05f6f,#c04050);}
/* 待办 */
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;margin:7px 0;background:var(--panel);}
.todo-item.done{opacity:.5;}
.todo-item.done .tt{text-decoration:line-through;}
.todo-item.overdue{border-color:var(--danger);}
.ck{width:17px;height:17px;cursor:pointer;accent-color:var(--accent2);flex-shrink:0;}
.tt{flex:1;font-size:13.5px;}
.tt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.filter-row .chip{font-size:12px;padding:4px 13px;border-radius:15px;border:1px solid var(--border);color:var(--muted);cursor:pointer;}
.filter-row .chip.on{background:#26304e;color:var(--accent);border-color:var(--accent);}
/* 简历 */
.cv-doc{background:#f7f8fc;color:#222;border-radius:10px;padding:36px 44px;font-family:"Songti SC","SimSun",serif;line-height:1.8;font-size:13.5px;max-height:72vh;overflow-y:auto;}
.cv-doc h1{font-size:21px;text-align:center;color:#1a1a2e;margin-bottom:4px;}
.cv-doc .cvsub{text-align:center;font-size:12px;color:#555;border-bottom:2px solid #1a1a2e;padding-bottom:10px;margin-bottom:14px;}
.cv-doc h2{font-size:15px;color:#1a1a2e;border-left:none;border-bottom:1px solid #888;padding-bottom:3px;margin:16px 0 8px;}
.cv-doc p,.cv-doc li{font-size:13px;color:#333;}
.cv-doc ul{margin-left:20px;}
.cv-doc .cvrow{display:flex;justify-content:space-between;}
.tips{font-size:12px;color:var(--muted);background:#1a2138;border:1px dashed #3d4c6e;border-radius:9px;padding:10px 14px;margin:10px 0;}
/* keypoint 列表 */
.kp{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:5px 0;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;}
.kp .del{cursor:pointer;color:var(--muted);margin-left:auto;}
.kp .del:hover{color:var(--danger);}
/* 文献卡片 */
.lit-card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:15px 18px;margin:10px 0;}
.lit-card .lh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.lit-card .lt{font-size:14.5px;color:#eef2ff;font-weight:600;cursor:pointer;}
.lit-card .lt:hover{color:var(--accent2);}
.lit-card .lm{font-size:12px;color:var(--muted);margin-top:3px;}
.lit-card .lb{margin-top:8px;}
.lit-card .notes{font-size:12.5px;color:var(--text);background:var(--panel2);border-radius:7px;padding:8px 11px;margin-top:8px;white-space:pre-wrap;}
.lit-card .kp-list{margin-top:8px;}
/* 汇报时间线 */
.tl{position:relative;padding-left:22px;}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:18px;}
.tl-item::before{content:'';position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);}
.tl-item .date{font-size:12px;color:var(--muted);}
.tl-item .body{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-top:5px;font-size:13px;}
.tl-item .ai{font-size:12px;color:var(--warn);margin-top:6px;}
/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#26304e;border:1px solid var(--accent2);color:var(--text);padding:10px 22px;border-radius:10px;font-size:13px;display:none;z-index:200;box-shadow:0 6px 24px rgba(0,0,0,.4);}
/* 数据管理 */
.dm-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;border:1px solid var(--border);border-radius:12px;cursor:pointer;background:var(--panel);transition:all .15s;text-align:center;}
.dm-btn:hover{border-color:var(--accent2);background:var(--panel2);}
.dm-btn .ic{font-size:26px;}
.dm-btn .lb{font-size:13px;color:var(--text);}
.dm-btn .ds{font-size:11px;color:var(--muted);}
/* ===== Onboarding 引导向导 ===== */
#onboard{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#171d31,#121622 60%);z-index:300;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
#onboard.show{display:flex;}
#auth{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#171d31,#121622 60%);z-index:400;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
#auth.show{display:flex;}
.auth-tabs{display:flex;gap:8px;margin:16px 0 18px;}
.auth-tab{flex:1;text-align:center;padding:9px;border-radius:9px;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:14px;user-select:none;}
.auth-tab.on{background:var(--panel2);border-color:var(--accent);color:var(--text);font-weight:600;}
.auth-logo{font-size:30px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#8b9cf5,#4ec9d4);-webkit-background-clip:text;background-clip:text;color:transparent;}
.auth-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.ob-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;width:100%;max-width:520px;padding:34px 38px;animation:obin .4s ease;margin:auto;}
@keyframes obin{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:none;}}
.ob-logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#6f7ef0,#4ec9d4);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#121622;margin:0 auto 16px;box-shadow:0 8px 28px rgba(111,126,240,.35);}
.ob-title{font-size:24px;font-weight:700;color:#eef2ff;text-align:center;}
.ob-sub{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 20px;}
.ob-steps{display:flex;gap:6px;justify-content:center;margin-bottom:22px;}
.ob-dot{width:34px;height:5px;border-radius:3px;background:#2a3354;transition:all .25s;}
.ob-dot.on{background:linear-gradient(90deg,#6f7ef0,#4ec9d4);}
.ob-q{font-size:16px;font-weight:600;color:#eef2ff;margin-bottom:14px;text-align:center;}
.ob-fields .fg{margin-bottom:12px;}
.ob-fields .fg label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.ob-fields input,.ob-fields select{width:100%;background:#0e1320;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;}
.ob-fields input:focus,.ob-fields select:focus{outline:none;border-color:var(--accent2);}
.ob-degrees{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.ob-degree{border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:#0e1320;}
.ob-degree:hover{border-color:var(--accent);}
.ob-degree.sel{border-color:var(--accent2);background:#1c2848;box-shadow:0 0 0 1px var(--accent2);}
.ob-degree .d1{font-size:15px;font-weight:600;color:#eef2ff;}
.ob-degree .d2{font-size:11px;color:var(--muted);margin-top:3px;}
.ob-btns{display:flex;gap:10px;margin-top:20px;}
.ob-btns .spacer{flex:1;}
.ob-skip{color:var(--muted);font-size:13px;cursor:pointer;align-self:center;}
.ob-skip:hover{color:var(--text);}
.ob-feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 4px;}
.ob-feat div{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--text);}
.ob-feat b{color:var(--accent2);}
/* 欢迎横幅 */
.welcome-banner{background:linear-gradient(120deg,#1d2742,#1c2133);border:1px solid #2d3e6e;border-radius:12px;padding:14px 18px;margin:14px 0;display:flex;align-items:center;gap:12px;animation:obin .35s ease;}
.welcome-banner .wi{font-size:22px;}
.welcome-banner .wt{font-size:14px;color:#eef2ff;}
.welcome-banner .wt small{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.welcome-banner .wa{margin-left:auto;display:flex;gap:8px;flex-shrink:0;}
@media(max-width:860px){.sidebar{width:60px;padding:14px 6px;}.brand .t1,.brand .t2,.nav-item span.tx,.nav-sec,.nav-item .badge{display:none;}.main{margin-left:60px;padding:16px;}.modal{padding:18px;}.ob-card{padding:26px 22px;}}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">DR</div>
      <div><div class="t1">DRSTUDY</div><div class="t2">研究生工作台</div></div>
    </div>
    <div id="cloudPill" class="cloud-pill">☁ 本地模式</div>
    <div id="logoutPill" class="cloud-pill" style="display:none;color:#e5484d;border:1px dashed #e5484d88;cursor:pointer;" onclick="doLogout()" title="退出当前账号（数据保留在本设备）">⎋ 退出登录</div>
    <div class="nav-item active" data-page="dashboard"><span class="ico">◎</span><span class="tx">工作台</span></div>
    <div class="nav-sec">科研管理</div>
    <div class="nav-item" data-page="literature"><span class="ico">📚</span><span class="tx">文献管理</span><span class="badge" id="nav-lit">0</span></div>
    <div class="nav-item" data-page="thesis"><span class="ico">✍</span><span class="tx">论文写作</span></div>
    <div class="nav-item" data-page="milestone"><span class="ico">🚩</span><span class="tx">课题里程碑</span></div>
    <div class="nav-item" data-page="research"><span class="ico">🔬</span><span class="tx">实验与数据</span></div>
    <div class="nav-item" data-page="mentor"><span class="ico">🧑‍🏫</span><span class="tx">导师汇报</span></div>
    <div class="nav-sec">学术与事务</div>
    <div class="nav-item" data-page="academic"><span class="ico">🎤</span><span class="tx">学术活动</span></div>
    <div class="nav-item" data-page="todo"><span class="ico">☑</span><span class="tx">待办中心</span><span class="badge" id="nav-todo">0</span></div>
    <div class="nav-item" data-page="cv"><span class="ico">👤</span><span class="tx">成果与简历</span></div>
    <div class="nav-sec">系统</div>
    <div class="nav-item" data-page="settings"><span class="ico">⚙</span><span class="tx">设置与数据</span></div>
  </aside>

  <!-- 主区域 -->
  <main class="main" id="main"></main>
</div>

<!-- 模态框 -->

<script>
/* ============================================================
   DRSTUDY · 博士研究生工作台
   单文件应用 · vanilla JS + localStorage
   ============================================================ */
const STORE_KEY = 'drbuddy_v1';            // 旧版单用户数据（迁移用）
const ACC_KEY  = 'drbuddy_accounts';       // 账号列表
const SESS_KEY = 'drbuddy_session';        // 当前登录账号
const dataKey  = id => 'drbuddy_data_' + id;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
const now = () => new Date().toISOString();
const daysUntil = (d) => { if(!d) return null; const diff = Math.ceil((new Date(d)-new Date(today()))/86400000); return diff; };
const esc = (s) => { const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; };

/* ---------- 默认数据 ---------- */
function defaultData(){
  return {
    profile:{name:'',school:'',major:'',advisor:'',enrollYear:'',targetYear:'',degree:'博士'},
    literature:[],
    thesis:{chapters:[],papers:[]},
    milestones:[],
    research:[],
    mentor:{cycleDays:14,lastReportDate:'',reports:[]},
    academic:[],
    todos:[],
    cv:{papers:[],awards:[],skills:[],services:[]},
    settings:{onboarded:false}
  };
}
let DB = defaultData();
let CUR = null; // 当前账号 {id, account}

/* ---------- 账号体系（本地多账号，无需实名） ---------- */
function getAccounts(){ try{ return JSON.parse(localStorage.getItem(ACC_KEY))||[]; }catch(e){ return []; } }
function setAccounts(a){ localStorage.setItem(ACC_KEY, JSON.stringify(a)); }
function pwHash(s){ let h=5381,h2=52711; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; h2=((h2<<5)+h2+s.charCodeAt(i))|0; } return (h>>>0).toString(36)+'.'+(h2>>>0).toString(36); }
function loadAccountData(id){
  try{
    const r = localStorage.getItem(dataKey(id));
    const d = r? JSON.parse(r): defaultData();
    // 兼容旧数据：补全新字段
    const def = defaultData();
    d.profile = Object.assign({}, def.profile, d.profile||{});
    d.settings = Object.assign({}, def.settings, d.settings||{});
    d.cv = Object.assign({}, def.cv, d.cv||{});
    d.thesis = Object.assign({}, def.thesis, d.thesis||{});
    d.mentor = Object.assign({}, def.mentor, d.mentor||{});
    return d;
  }catch(e){ return defaultData(); }
}
function initSession(){
  const sid = localStorage.getItem(SESS_KEY);
  if(!sid) return false;
  if(sid==='guest'){ CUR={id:'guest',account:'访客体验'}; DB=loadAccountData('guest'); return true; }
  const acc = getAccounts().find(a=>a.id===sid);
  if(acc){ CUR=acc; DB=loadAccountData(acc.id); return true; }
  return false;
}
function doRegister(){
  const acc = val('au_acc').trim();
  const pw = val('au_pw'), pw2 = val('au_pw2');
  const isPhone = /^1[3-9]\d{9}$/.test(acc);
  const isMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(acc);
  if(!isMail && !isPhone){ toast('请输入正确的邮箱或手机号'); return; }
  if(pw.length<6){ toast('密码至少 6 位'); return; }
  if(pw!==pw2){ toast('两次输入的密码不一致'); return; }
  const accs = getAccounts();
  if(accs.find(a=>a.account===acc)){ toast('该账号已注册，请直接登录'); renderAuth('login'); return; }
  const id = uid();
  // 首个注册账号迁移旧版数据（若旧版有内容）
  let data = defaultData();
  if(!accs.length && !localStorage.getItem(dataKey('guest'))){
    try{ const legacy = JSON.parse(localStorage.getItem(STORE_KEY)||'null');
      if(legacy && ((legacy.literature||[]).length || (legacy.profile||{}).name)) data = legacy;
    }catch(e){}
  }
  const account = {id, account:acc, pw:pwHash(pw+'·drbuddy')};
  accs.push(account); setAccounts(accs);
  localStorage.setItem(dataKey(id), JSON.stringify(data));
  localStorage.setItem(SESS_KEY, id);
  CUR=account; DB=loadAccountData(id);
  hideAuth(); bootApp();
  cloudRegister(account, pw, DB); // 云端登记（若已启用）
  if(!DB.settings.onboarded && !DB.profile.name){ showOnboard(); }
  toast('注册成功，欢迎！');
}
function doLogin(){
  const acc = val('au_acc').trim(), pw = val('au_pw');
  const a = getAccounts().find(x=>x.account===acc);
  if(!a){
    // 本机没有此账号：尝试云端登录（跨设备）
    if(CB.on){ toast('正在从云端登录…'); cloudLogin(acc, pw); }
    else { toast('账号不存在，请先注册'); }
    return;
  }
  if(a.pw!==pwHash(pw+'·drbuddy')){ toast('密码错误'); return; }
  localStorage.setItem(SESS_KEY, a.id);
  CUR=a; DB=loadAccountData(a.id);
  hideAuth(); bootApp();
  cloudBootSync(); // 拉取云端最新
  if(CB.on){ sbSignIn(acc, pw, true).then(u=>{ if(u) cloudBootSync(); }); } // 静默建立云端会话
  toast('欢迎回来，'+(DB.profile.name||acc));
}
function guestLogin(){
  if(!localStorage.getItem(dataKey('guest'))) localStorage.setItem(dataKey('guest'), JSON.stringify(defaultData()));
  localStorage.setItem(SESS_KEY,'guest');
  CUR={id:'guest',account:'访客体验'}; DB=loadAccountData('guest');
  hideAuth(); bootApp();
  if(!DB.settings.onboarded && !DB.profile.name){ showOnboard(); }
}
function doLogout(){
  uiConfirm('退出当前账号？数据保留在本设备，可随时重新登录。',()=>{ localStorage.removeItem(SESS_KEY); location.reload(); });
}

/* ---------- 云端同步（双后端：腾讯云 CloudBase / Supabase，由 cloud-config.js 的 provider 决定） ----------
   CloudBase 模式：匿名登录（设备身份）→ 所有读写经云函数 drbuddyCloud（需在控制台添加 Web 安全域名）
   Supabase 模式：邮箱+密码 Auth（手机号映射为 <手机号>@drstudy.cn）→ 数据存 drbuddy_data 表（RLS 隔离）
   未配置 / 云端不可用时自动退回纯本地模式，不影响使用。 */
const CB = {on:false, mode:'', sb:null, app:null, lastSync:''};
function cloudConf(){ try{ return window.DRSTUDY_CLOUD||{}; }catch(e){ return {}; } }
function cloudPill(msg, cls){
  const p = document.getElementById('cloudPill'); if(!p) return;
  p.textContent = msg; p.className = 'cloud-pill ' + (cls||'');
}
function loadScript(srcs, ok, fail){
  const s = document.createElement('script'); let i = 0;
  s.src = srcs[0];
  s.onload = ok;
  s.onerror = () => { i++; if(i < srcs.length){ s.src = srcs[i]; } else fail(); };
  document.head.appendChild(s);
}
function cloudInit(){
  const c = cloudConf();
  if(c.provider==='supabase' && c.url && c.key){
    /* ===== Supabase 模式 ===== */
    cloudPill('☁ 连接云端…','sync');
    loadScript(['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
                'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'],
      async () => {
        try{
          CB.sb = window.supabase.createClient(c.url, c.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
          CB.on = true; CB.mode = 'supabase';
          cloudPill('☁ 云端已连接','ok');
          cloudBootSync();
        }catch(e){ console.warn('Supabase init fail', e); cloudPill('☁ 云端未连接','err'); }
      },
      () => cloudPill('☁ 云端未连接','err'));
    return;
  }
  if(c.env){
    /* ===== 腾讯云 CloudBase 模式 ===== */
    cloudPill('☁ 连接云端…','sync');
    loadScript(['https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js',
                'https://static.cloudbase.net/cloudbase-js-sdk/2.17.3/cloudbase.full.js'],
      async () => {
        try{
          CB.app = cloudbase.init({env:c.env});
          const auth = CB.app.auth({persistence:'local'});
          if(!auth.hasLoginState()) await auth.signInAnonymously();
          CB.on = true; CB.mode = 'cloudbase';
          cloudPill('☁ 云端已连接','ok');
          cloudBootSync();
        }catch(e){ console.warn('CloudBase init fail', e); cloudPill('☁ 云端未连接','err'); }
      },
      () => cloudPill('☁ 云端未连接','err'));
    return;
  }
  cloudPill('☁ 本地模式');   // 未配置：纯本地模式
}
/* 当前 Supabase 登录用户（未登录返回 null） */
async function sbUser(){
  if(!CB.on || CB.mode!=='supabase') return null;
  try{ const {data} = await CB.sb.auth.getUser(); return data && data.user; }catch(e){ return null; }
}
/* CloudBase 云函数调用 */
function cbCall(data){
  if(!CB.on || CB.mode!=='cloudbase') return Promise.resolve(null);
  return CB.app.callFunction({name: cloudConf().func||'drbuddyCloud', data})
    .then(r => r && r.result).catch(e => { console.warn('cbCall fail', e); cloudPill('☁ 云端不可用','err'); return null; });
}
/* 手机号 → 伪邮箱（仅 Supabase 用；控制台需关闭"确认邮件"） */
function sbEmail(acc){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(acc) ? acc : (acc||'').replace(/\D/g,'')+'@drstudy.cn'; }
/* Supabase 登录（quiet=true 静默刷新会话，不弹提示） */
async function sbSignIn(acc, pw, quiet){
  if(!CB.on || CB.mode!=='supabase') return null;
  try{
    const {data, error} = await CB.sb.auth.signInWithPassword({email:sbEmail(acc), password:pw});
    if(error){
      if(!quiet) toast(/Invalid login/i.test(error.message||'') ? '账号或密码错误' : ('云端登录失败：'+error.message));
      return null;
    }
    return data && data.user;
  }catch(e){ return null; }
}
/* 保存后防抖推送云端 */
let _cpTimer = null;
function cloudPush(){
  if(!CB.on || !CUR || CUR.id==='guest') return;
  clearTimeout(_cpTimer);
  _cpTimer = setTimeout(async () => {
    if(CB.mode==='supabase'){
      const u = await sbUser();
      if(!u) return;  // 云端未登录：只存本地
      cloudPill('☁ 同步中…','sync');
      const {error} = await CB.sb.from('drbuddy_data').upsert({user_id:u.id, data:DB, updated_at:new Date().toISOString()});
      if(error){ console.warn('cloudPush fail', error); cloudPill('☁ 同步失败','err'); }
      else{ CB.lastSync = new Date().toTimeString().slice(0,5); cloudPill('☁ 已同步 '+CB.lastSync,'ok'); }
    }else{
      cloudPill('☁ 同步中…','sync');
      const r = await cbCall({action:'save', account:CUR.account, pw:CUR.pw||'', data:DB});
      if(r && r.ok){ CB.lastSync = new Date().toTimeString().slice(0,5); cloudPill('☁ 已同步 '+CB.lastSync,'ok'); }
      else if(r && r.err){ cloudPill('☁ 同步失败','err'); }
    }
  }, 1500);
}
/* 启动/登录后拉取云端最新数据（云端较新才覆盖本地） */
async function cloudBootSync(){
  if(!CB.on || !CUR || CUR.id==='guest') return;
  if(CB.mode==='supabase'){
    const u = await sbUser(); if(!u) return;
    const {data, error} = await CB.sb.from('drbuddy_data').select('data,updated_at').eq('user_id',u.id).maybeSingle();
    if(error || !data || !data.data) return;
    const ct = Date.parse(data.updated_at||''), lt = Date.parse((DB.settings&&DB.settings.updatedAt)||'');
    if(!isNaN(ct) && (isNaN(lt) || ct > lt)){
      localStorage.setItem(dataKey(CUR.id), JSON.stringify(data.data));
      DB = loadAccountData(CUR.id); save();
      if(APP_READY){ go(CUR_PAGE); toast('已从云端同步最新数据'); }
    }
  }else{
    if(!CUR.account || !CUR.pw) return;
    const r = await cbCall({action:'load', account:CUR.account, pw:CUR.pw});
    if(!r || !r.ok) return;
    const cloudAt = r.updatedAt||'';
    const localAt = (DB.settings&&DB.settings.updatedAt)||'';
    if(cloudAt > localAt && r.data){
      localStorage.setItem(dataKey(CUR.id), JSON.stringify(r.data));
      DB = loadAccountData(CUR.id); save();
      if(APP_READY){ go(CUR_PAGE); toast('已从云端同步最新数据'); }
    }
  }
}
/* 跨设备登录：本地无此账号时到云端验证并拉取 */
async function cloudLogin(acc, pw){
  if(CB.mode==='supabase'){
    toast('正在从云端登录…');
    const u = await sbSignIn(acc, pw);
    if(!u) return;
    const {data:row} = await CB.sb.from('drbuddy_data').select('data,updated_at').eq('user_id',u.id).maybeSingle();
    const account = {id:uid(), account:acc, pw:pwHash(pw+'·drbuddy')};
    const accs = getAccounts(); accs.push(account); setAccounts(accs);
    localStorage.setItem(dataKey(account.id), JSON.stringify((row&&row.data)||defaultData()));
    localStorage.setItem(SESS_KEY, account.id);
    CUR=account; DB=loadAccountData(account.id);
    hideAuth(); bootApp();
    if(!DB.settings.onboarded && !DB.profile.name){ showOnboard(); }
    toast('欢迎回来，'+(DB.profile.name||acc));
  }else{
    const r = await cbCall({action:'login', account:acc, pw:pwHash(pw+'·drbuddy')});
    if(!r){ toast('云端暂时无法连接，请稍后再试'); return; }
    if(r.err==='noaccount'){ toast('账号不存在，请先注册'); return; }
    if(r.err==='wrongpw'){ toast('密码错误'); return; }
    const account = {id:uid(), account:acc, pw:pwHash(pw+'·drbuddy')};
    const accs = getAccounts(); accs.push(account); setAccounts(accs);
    localStorage.setItem(dataKey(account.id), JSON.stringify(r.data||defaultData()));
    localStorage.setItem(SESS_KEY, account.id);
    CUR=account; DB=loadAccountData(account.id);
    hideAuth(); bootApp();
    toast('欢迎回来，'+(DB.profile.name||acc));
  }
}
/* 注册后把账号登记到云端 */
async function cloudRegister(account, pwPlain, data){
  if(!CB.on) return;
  if(CB.mode==='supabase'){
    try{
      const {data:r, error} = await CB.sb.auth.signUp({email:sbEmail(account.account), password:pwPlain});
      if(error){ toast('云端注册失败：'+error.message); return; }
      if(r && r.user){
        await CB.sb.from('drbuddy_data').upsert({user_id:r.user.id, data, updated_at:new Date().toISOString()});
        cloudPill('☁ 已同步','ok');
      }
    }catch(e){ console.warn('cloudRegister fail', e); }
  }else{
    const r = await cbCall({action:'register', account:account.account, pw:account.pw, data});
    if(r && r.err==='exists'){ toast('提示：该账号已在其他设备注册过，本设备将无法云同步它'); }
  }
}

function load(){
  try{
    const r = localStorage.getItem(STORE_KEY);
    const d = r? JSON.parse(r): defaultData();
    const def = defaultData();
    d.profile = Object.assign({}, def.profile, d.profile||{});
    d.settings = Object.assign({}, def.settings, d.settings||{});
    d.cv = Object.assign({}, def.cv, d.cv||{});
    d.thesis = Object.assign({}, def.thesis, d.thesis||{});
    d.mentor = Object.assign({}, def.mentor, d.mentor||{});
    return d;
  }catch(e){ return defaultData(); }
}
function save(){ DB.settings.updatedAt = now(); localStorage.setItem(dataKey(CUR?CUR.id:'guest'), JSON.stringify(DB)); updateBadges(); cloudPush(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2200); }

/* ---------- 导航 ---------- */
const pages = {};
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click',()=>go(el.dataset.page));
});
let CUR_PAGE = 'dashboard';
function go(page){
  CUR_PAGE = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  let pg = document.getElementById('pg-'+page);
  if(!pg){ pg = document.createElement('div'); pg.className='page'; pg.id='pg-'+page; document.getElementById('main').appendChild(pg); }
  pg.classList.add('active');
  if(pages[page]) pages[page]();
  window.scrollTo(0,0);
}

/* ---------- 模态框 ---------- */
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){ document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click',e=>{ if(e.target.id==='modalMask') closeModal(); });

/* ---------- 应用内确认弹窗（兼容微信内置浏览器，原生confirm可能被拦截） ---------- */
let _cfCb = null;
function uiConfirm(msg, cb){
  _cfCb = cb;
  document.getElementById('cfMsg').textContent = msg;
  document.getElementById('cfMask').classList.add('show');
}
function cfYes(){ document.getElementById('cfMask').classList.remove('show'); const cb=_cfCb; _cfCb=null; if(cb) cb(); }
function cfNo(){ document.getElementById('cfMask').classList.remove('show'); _cfCb=null; }
document.getElementById('cfMask').addEventListener('click',e=>{ if(e.target.id==='cfMask') cfNo(); });

/* ---------- 徽标 ---------- */
function updateBadges(){
  const lit = DB.literature.filter(l=>l.status==='待读').length;
  const todo = DB.todos.filter(t=>!t.done && t.status!=='someday').length;
  const el1=document.getElementById('nav-lit'), el2=document.getElementById('nav-todo');
  el1.textContent=lit; el1.style.display=lit?'':'none';
  el2.textContent=todo; el2.style.display=todo?'':'none';
}

/* ============================================================
   1. 工作台 Dashboard
   ============================================================ */

pages.literature = function(){
  let filter = pages.literature._f || 'all';
  let search = pages.literature._s || '';
  const all = DB.literature;
  let list = all;
  if(filter!=='all') list = list.filter(l=>l.status===filter);
  if(search) list = list.filter(l=>(l.title+l.authors+l.tags.join('')+l.venue).toLowerCase().includes(search.toLowerCase()));

  document.getElementById('pg-literature').innerHTML = `
    <h2>📚 文献管理 <span class="sub">共 ${all.length} 篇 · 已读 ${all.filter(l=>l.status==='已读'||l.status==='已整理').length}</span></h2>
    <div class="filter-row">
      ${['all','待读','在读','已读','已整理'].map(s=>`<span class="chip ${filter===s?'on':''}" onclick="setLitFilter('${s}')">${s==='all'?'全部':s}</span>`).join('')}
      <input class="fg" style="max-width:220px;margin-left:auto;" placeholder="搜索标题/作者/标签…" value="${esc(search)}" oninput="setLitSearch(this.value)">
      <span class="btn primary sm" onclick="litModal()">+ 添加文献</span>
    </div>
    ${list.length? list.map(l=>`
      <div class="lit-card">
        <div class="lh">
          <div>
            <div class="lt" onclick="litModal('${l.id}')">${esc(l.title)}</div>
            <div class="lm">${esc(l.authors)} · ${esc(l.venue)} · ${l.year||''} ${l.doi?'· DOI: '+esc(l.doi):''}</div>
          </div>
          <div>
            <span class="tag ${litStatusTag(l.status)}">${esc(l.status)}</span>
            ${l.rating? '★'.repeat(l.rating):''}
          </div>
        </div>
        ${l.tags.length?`<div class="lb">${l.tags.map(t=>`<span class="tag t-gray">${esc(t)}</span>`).join('')}</div>`:''}
        ${l.keyPoints&&l.keyPoints.length?`<div class="kp-list">${l.keyPoints.map(k=>`<div class="kp">💡 ${esc(k)}</div>`).join('')}</div>`:''}
        ${l.notes?`<div class="notes">${esc(l.notes)}</div>`:''}
      </div>
    `).join('') : '<div class="empty">暂无文献，点击「添加文献」开始构建你的文献库</div>'}
  `;

function litStatusTag(s){ return {待读:'t-red',在读:'t-gold',已读:'t-green',已整理:'t-purple'}[s]||'t-gray'; }
function setLitFilter(f){ pages.literature._f=f; pages.literature(); }
function setLitSearch(s){ pages.literature._s=s; pages.literature(); }

function litModal(id){

function litSave(id){
  const obj = {
    title: val('lf_title').trim(), authors: val('lf_authors').trim(), year: val('lf_year').trim(),
    venue: val('lf_venue').trim(), doi: val('lf_doi').trim(),
    status: val('lf_status'), rating: parseInt(val('lf_rating'))||0,
    tags: val('lf_tags').split(',').map(s=>s.trim()).filter(Boolean),
    keyPoints: val('lf_kp').split('\n').map(s=>s.trim()).filter(Boolean),
    notes: val('lf_notes').trim()
  };
  if(!obj.title){ toast('请填写标题'); return; }
  if(id){ Object.assign(DB.literature.find(x=>x.id===id), obj); }
  else { obj.id=uid(); obj.addedAt=now(); DB.literature.unshift(obj); }
  save(); closeModal(); pages.literature(); toast('已保存');
}
function litDel(id){ uiConfirm('确认删除该文献？',()=>{ DB.literature=DB.literature.filter(x=>x.id!==id); save(); closeModal(); pages.literature(); toast('已删除'); }); }

  document.getElementById('pg-thesis').innerHTML = `
    <h2>✍ 论文写作 <span class="sub">学位论文 ${chs.length} 章 · 小论文 ${pps.length} 篇</span></h2>

      ${chs.length? `
        <div style="margin:8px 0 14px;"><div class="bar"><div class="fill ${pct<40?'danger':pct<70?'warn':''}" style="width:${pct}%"></div></div>
        <div class="muted" style="font-size:12px;margin-top:5px;">总进度 ${pct}% · ${totalCurrent.toLocaleString()} / ${totalTarget.toLocaleString()} 字</div></div>
        <table><tr><th>章节</th><th>目标字数</th><th>当前字数</th><th>进度</th><th>状态</th><th>截止</th><th>操作</th></tr>
        ${chs.map(c=>{
          const cp = c.targetWords? Math.round(c.currentWords/c.targetWords*100):0;
          const d=daysUntil(c.deadline);
          return `<tr>
            <td>${esc(c.title)}</td><td>${(c.targetWords||0).toLocaleString()}</td><td>${(c.currentWords||0).toLocaleString()}</td>
            <td style="min-width:90px;"><div class="bar" style="height:6px;"><div class="fill ${cp<40?'danger':cp<70?'warn':''}" style="width:${Math.min(cp,100)}%"></div></div><small class="muted">${cp}%</small></td>
            <td><span class="tag ${chStatusTag(c.status)}">${esc(c.status)}</span></td>
            <td>${c.deadline||'-'}${d!==null&&d>=0?` <small class="muted">(${d}天)</small>`:''}</td>

pages.todo = function(){
  const f = pages.todo._f || 'all';
  let list = DB.todos;
  if(f!=='all') list = list.filter(t=>t.status===f);
  list = list.sort((a,b)=>(a.done-b.done)||(a.priority==='紧急'?0:1)-(b.priority==='紧急'?0:1)||(a.due||'z').localeCompare(b.due||'z'));
  const counts = {all:DB.todos.filter(t=>!t.done).length,inbox:DB.todos.filter(t=>t.status==='inbox'&&!t.done).length,next:DB.todos.filter(t=>t.status==='next'&&!t.done).length,project:DB.todos.filter(t=>t.status==='project'&&!t.done).length,waiting:DB.todos.filter(t=>t.status==='waiting'&&!t.done).length,someday:DB.todos.filter(t=>t.status==='someday').length};
  document.getElementById('pg-todo').innerHTML = `
    <h2>☑ 待办中心 <span class="sub">GTD 任务流 · 收件箱→下一步→项目</span></h2>
    <div class="filter-row">
      ${[['all','全部'],['inbox','收件箱'],['next','下一步'],['project','项目'],['waiting','等待'],['someday','将来/也许']].map(([k,n])=>`<span class="chip ${f===k?'on':''}" onclick="setTodoF('${k}')">${n}${counts[k]?'('+counts[k]+')':''}</span>`).join('')}
      <span class="btn primary sm" style="margin-left:auto;" onclick="tdModal()">+ 添加待办</span>
    </div>
    ${renderTodoList(list,'todo')}
  `;
};
function setTodoF(f){pages.todo._f=f;pages.todo();}
function renderTodoList(list,ctx){
  if(!list.length) return '<div class="empty">暂无待办</div>';
  return list.map(t=>{
    const d=daysUntil(t.due); const overdue=!t.done&&d!==null&&d<0;
    return `<div class="todo-item ${t.done?'done':''} ${overdue?'overdue':''}">
      <input type="checkbox" class="ck" ${t.done?'checked':''} onchange="tdToggle('${t.id}')">
      <div class="tt">${esc(t.text)}
        <small>${t.project?'📁 '+esc(t.project)+' · ':''}${t.context?'@'+esc(t.context)+' · ':''}<span class="tag ${t.priority==='紧急'?'t-red':t.priority==='高'?'t-gold':'t-gray'}">${esc(t.priority)}</span>${t.due?' · '+t.due:''}${overdue?' · 已逾期':''}</small>
      </div>
      <span class="btn sm" onclick="tdModal('${t.id}')">编辑</span>
    </div>`;
  }).join('');
}
function tdModal(id){
  const t = id? DB.todos.find(x=>x.id===id) : {id:'',text:'',project:'',context:'',status:'inbox',due:'',priority:'中',done:false};
  openModal(`
    <h3>${id?'编辑待办':'添加待办'} <span class="close" onclick="closeModal()">✕</span></h3>
    <div class="form-grid">
      <div class="fg full"><label>任务内容 *</label><input id="tf_text" value="${esc(t.text)}"></div>
      <div class="fg"><label>所属项目</label><input id="tf_proj" value="${esc(t.project)}" placeholder="如 学位论文第三章"></div>
      <div class="fg"><label>情境</label><input id="tf_ctx" value="${esc(t.context)}" placeholder="如 @实验室 @电脑"></div>
      <div class="fg"><label>状态</label><select id="tf_status">${[['inbox','收件箱'],['next','下一步'],['project','项目'],['waiting','等待'],['someday','将来/也许']].map(([v,n])=>`<option value="${v}" ${t.status===v?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="fg"><label>优先级</label><select id="tf_pri">${['紧急','高','中','低'].map(s=>`<option ${t.priority===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="fg"><label>截止日期</label><input id="tf_due" type="date" value="${t.due||''}"></div>
    </div>
    <div class="btn-row">${id?`<span class="btn danger sm" onclick="tdDel('${id}')">删除</span>`:''}<span class="btn" onclick="closeModal()">取消</span><span class="btn primary" onclick="tdSave('${id}')">保存</span></div>
  `);
}
function tdSave(id){
  const obj={text:val('tf_text').trim(),project:val('tf_proj').trim(),context:val('tf_ctx').trim(),status:val('tf_status'),priority:val('tf_pri'),due:val('tf_due')};
  if(!obj.text){toast('请填写任务内容');return;}
  if(id){Object.assign(DB.todos.find(x=>x.id===id),obj);}else{obj.id=uid();obj.done=false;obj.createdAt=now();DB.todos.push(obj);}
  save();closeModal();refreshTodo();toast('已保存');

}

function wxLogin(){
  const wx = (window.DRSTUDY_CLOUD && window.DRSTUDY_CLOUD.wechat) || {};
  if(!wx.enabled || !wx.appid){
    toast('微信登录暂未开通：需在微信开放平台申请网站应用后配置。可先用邮箱/手机号注册登录');
    return;
  }
  const redirect = encodeURIComponent(location.origin + location.pathname);
  location.href = 'https://open.weixin.qq.com/connect/qrconnect?appid='+wx.appid+'&redirect_uri='+redirect+'&response_type=code&scope=snsapi_login&state=drstudy#wechat_redirect';
}
/* 微信扫码回跳处理：用 code 换取账号并入座本地 */
async function wxCallback(code){
  toast('微信登录中…');
  for(let i=0;i<20 && !CB.on;i++){ await new Promise(r=>setTimeout(r,300)); } // 等云端就绪（最多 6s）
  let r = null;
  try{ r = await cbCall({action:'wxlogin', code}); }catch(e){ console.warn('wxlogin fail', e); }
  if(!r || !r.ok){
    toast('微信登录失败：'+((r&&r.msg)||'云端无响应'));
    if(!CUR){ showAuth(); }
    return;
  }
  let a = getAccounts().find(x=>x.account===r.account);
  if(!a){
    a = {id:uid(), account:r.account, pw:r.token};
    const accs = getAccounts(); accs.push(a); setAccounts(accs);
    localStorage.setItem(dataKey(a.id), JSON.stringify(r.data||defaultData()));
  }
  localStorage.setItem(SESS_KEY, a.id);
  CUR=a; DB=loadAccountData(a.id);
  hideAuth(); bootApp();
  cloudBootSync();
  if(!DB.settings.onboarded && !DB.profile.name){ showOnboard(); }
  toast('微信登录成功，欢迎！');
}

/* ============================================================
   智能提示引擎
   ============================================================ */
function genSuggestions(){
  const s=[];
  // 1. 里程碑临近
  DB.milestones.filter(m=>m.status!=='已完成').forEach(m=>{
    const d=daysUntil(m.date);
    if(d!==null){
      if(d<0) s.push({lvl:'high',txt:`里程碑「${m.title}」已逾期 ${-d} 天，请尽快推进或调整计划`});
      else if(d<=7) s.push({lvl:'high',txt:`里程碑「${m.title}」将在 ${d} 天后到来（${m.date}），确认准备事项是否就绪`});
      else if(d<=30) s.push({lvl:'mid',txt:`里程碑「${m.title}」还有 ${d} 天，建议开始准备`});
    }
  });
  // 2. 导师汇报到期
  const mt=DB.mentor;
  if(mt.cycleDays&&mt.lastReportDate){
    const d=new Date(mt.lastReportDate); d.setDate(d.getDate()+parseInt(mt.cycleDays));
    const next=d.toISOString().slice(0,10); const dd=daysUntil(next);
    if(dd<0) s.push({lvl:'high',txt:`导师汇报已逾期 ${-dd} 天（上次：${mt.lastReportDate}，周期 ${mt.cycleDays} 天），建议尽快安排汇报`});
    else if(dd<=3) s.push({lvl:'mid',txt:`距下次导师汇报约 ${dd} 天，建议整理本周进展和待确认问题`});
  }
  // 3. 文献阅读节奏
  const litRead=DB.literature.filter(l=>l.status==='待读');
  if(litRead.length>=5) s.push({lvl:'low',txt:`待读文献堆积 ${litRead.length} 篇，建议安排集中阅读时间`});
  const recent=DB.literature.filter(l=>{ const ad=new Date(l.addedAt); return (new Date()-ad)/86400000>14 && l.status==='待读'; });
  if(recent.length>=3) s.push({lvl:'mid',txt:`有 ${recent.length} 篇文献入库超过 2 周仍未阅读，注意不要积压`});
  // 4. 写作进度预警
  DB.thesis.chapters.forEach(c=>{
    if(c.deadline&&c.status!=='已完成'){
      const d=daysUntil(c.deadline); const cp=c.targetWords?c.currentWords/c.targetWords:0;
      if(d!==null&&d>=0&&d<=14&&cp<0.7) s.push({lvl:cp<0.4?'high':'mid',txt:`章节「${c.title}」距截止 ${d} 天，进度仅 ${Math.round(cp*100)}%，需加速`});
    }
  });
  // 5. 待办逾期
  const overdue=DB.todos.filter(t=>!t.done&&t.due&&daysUntil(t.due)<0);
  if(overdue.length) s.push({lvl:overdue.length>=3?'high':'mid',txt:`有 ${overdue.length} 项待办已逾期，建议优先处理或重新排期`});
  const urgent=DB.todos.filter(t=>!t.done&&t.priority==='紧急');
  if(urgent.length) s.push({lvl:'high',txt:`有 ${urgent.length} 项紧急待办待处理`});
  // 6. 小论文状态停滞
  DB.thesis.papers.forEach(p=>{
    if(p.status==='投稿中'&&p.submittedDate){
      const d=daysUntil(p.submittedDate); const wait=-d;
      if(wait>90) s.push({lvl:'mid',txt:`小论文「${p.title}」投稿已 ${wait} 天，可考虑适度跟进或准备备选期刊`});
    }
  });
  // 7. 毕业倒计时
  const p=DB.profile;
  if(p.targetYear){
    const gradDate=p.targetYear+'-06-30'; const d=daysUntil(gradDate);
    if(d>0&&d<365) s.push({lvl:d<180?'high':'mid',txt:`距目标毕业（${gradDate}）还有 ${d} 天，合理规划剩余时间`});
  }
  return s.length? s.slice(0,8): [];
}

let APP_READY = false;
function bootApp(){
  if(APP_READY) return; APP_READY = true;
  updateBadges();
  go('dashboard');
  applyResp();
  const lp = document.getElementById('logoutPill'); if(lp) lp.style.display = '';
  // 首次使用：显示引导向导
  if(!DB.settings.onboarded && !DB.profile.name){ showOnboard(); }
  // 老用户首次升级到新版：补标记
  if(!DB.settings.onboarded && DB.profile.name){ DB.settings.onboarded = true; save(); }
}
